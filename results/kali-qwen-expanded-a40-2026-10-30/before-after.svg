  <text x="36" y="70" font-family="Arial, sans-serif" font-size="13" fill="#475569">638-step SFT on one A40 · counts out of 64</text>
  <rect x="482" y="32" width="14" height="14" rx="3" fill="#94a3b8"/>
  <text x="504" y="44" font-family="Arial, sans-serif" font-size="13" fill="#334155">Base</text>
