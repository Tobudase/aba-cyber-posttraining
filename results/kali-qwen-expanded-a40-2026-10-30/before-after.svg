<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3-8B internal DEV64 before and after SFT</title>
  <desc id="desc">Strict correctness rises from 19 to 22 of 64. Exact reference command rises from 13 to 17 of 64. Same-publisher silver-label internal development results, not official benchmark scores.</desc>
