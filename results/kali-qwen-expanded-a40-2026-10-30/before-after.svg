  <text x="604" y="44" font-family="Arial, sans-serif" font-size="13" fill="#334155">Post-SFT</text>
  <text x="36" y="123" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Strict tool + option value</text>
  <rect x="280" y="102" width="209" height="25" rx="5" fill="#94a3b8"/>
  <rect x="280" y="137" width="242" height="25" rx="5" fill="#0d9488"/>
